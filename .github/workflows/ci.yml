name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run tests
        run: npm test

# Pair with repomark workflow from oss-toolchain bootstrap.

# CI validates collab-kit; pair with @topdaily-dev/repomark check locally.
